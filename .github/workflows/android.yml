name: Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :app:assembleDebug :app:verifyPaparazziDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: orbit-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
